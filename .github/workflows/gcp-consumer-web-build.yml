# Build, push, and deploy salva-consumer-web to Cloud Run.
#
# Triggers: tag push (v*) or manual workflow_dispatch.
#
# Required GitHub Environment "production":
#   Secrets: GCP_SA_KEY, GCP_PROJECT_ID
#   Vars: NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_VAPID_PUBLIC_KEY
#         (baked into the Next.js client bundle at docker build time)

name: Build, push, deploy consumer web to Cloud Run

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Domain mappings are not available in asia-south1; use a supported region.
  # https://docs.cloud.google.com/run/docs/mapping-custom-domains
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: salvafeast
  IMAGE_NAME: salva-consumer-web
  CLOUD_RUN_SERVICE: salva-consumer-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build consumer web image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TAG_NAME: ${{ github.ref_name }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${TAG_NAME}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is required in environment production vars"
            exit 1
          fi

          docker build \
            -f Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}" \
            -t "${IMAGE}" \
            .

      - name: Push consumer web image
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE }}"

      - name: Tag as latest (optional)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker tag "${{ env.IMAGE }}" "${LATEST}"
          docker push "${LATEST}"

  deploy:
    name: Deploy consumer web to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve runtime service account from GCP_SA_KEY
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          creds_path = os.environ.get("GOOGLE_GHA_CREDS_PATH") or os.environ.get("GOOGLE_APPLICATION_CREDENTIALS")
          if not creds_path:
              raise SystemExit("Could not find Google credentials path in environment")

          with open(creds_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          client_email = data.get("client_email")
          if not client_email:
              raise SystemExit("client_email not found in credentials JSON")

          github_env = os.environ["GITHUB_ENV"]
          with open(github_env, "a", encoding="utf-8") as f:
              f.write(f"RUNTIME_SA={client_email}\n")
          print(f"Using runtime service account: {client_email}")
          PY

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${TAG_NAME}"

          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --service-account "${{ env.RUNTIME_SA }}" \
            --allow-unauthenticated \
            --no-invoker-iam-check \
            --quiet \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10
